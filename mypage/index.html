<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>NOVARE</title>
</head>
<body>
<script>
/* 前の住所。新しい住所へ送るだけ（# の鍵と ? の合図を引きつぐ）。?k= の古いリンクは # に移す。ここでは何も残さない */
(function () {
  var q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.slice(1));
  var k = h.get('k') || q.get('k'); q.delete('k'); q.delete('s');
  var s = q.toString();
  location.replace('https://novare-salon.web.app/mypage/' + (s ? '?' + s : '') + (k ? '#k=' + encodeURIComponent(k) : ''));
})();
</script>
<noscript><p>このページを見るには JavaScript を有効にしてください。</p></noscript>
</body>
</html>
