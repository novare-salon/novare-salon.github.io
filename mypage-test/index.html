<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>NOVARE｜マイページ</title>
<style>
html,body{margin:0;height:100%;background:#F2F5F9}
iframe{display:block;border:0;width:100%;height:100%}
p{font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:#1B2230;text-align:center;padding:40px 20px}
</style>
</head>
<body>
<script>
/* NOVARE マイページの入れ物（test）。Google の「Apps Script のユーザーによって作成…」の帯を出さないため、マイページをこの中に入れて見せる。
   受け取った合図（k / s / r / code / state / error など）を、そのままマイページに渡すだけ。ここでは何も残さない。 */
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbydM66_qaVXXOlo6uoW8nuvDDuzZw5bq0i5-OUzu8aYoBHJ6hL-Fb-wMU2xJY9Zk1-J/exec';
  var allow = ['k','s','r','from','style','code','state','error','error_description'];
  var q = new URLSearchParams(location.search), out = new URLSearchParams();
  allow.forEach(function (n) { if (q.has(n)) out.set(n, q.get(n)); });
  if (q.has('code') || q.has('error')) { out.set('w', '1'); history.replaceState(null, '', location.pathname); } /* w=1：入れ物から来た合図（LINE とのやりとりで戻り先をそろえるため）。使い終わった合図を住所の欄から消す */
  var f = document.createElement('iframe');
  f.src = EXEC + (out.toString() ? '?' + out.toString() : '');
  f.title = 'NOVARE マイページ';
  f.allow = 'camera; clipboard-write';
  document.body.appendChild(f);
})();
</script>
<noscript><p>このページを見るには JavaScript を有効にしてください。</p></noscript>
</body>
</html>
